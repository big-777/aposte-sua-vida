<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            transition: background 0.3s ease;
        }

        body.test-mode {
            background: #8b0000;
        }

        .container {
            width: 420px;
            max-width: 95%;
            padding: 30px;
            text-align: center;
            background: #222;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .credits {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .reel {
            width: 95px;
            height: 95px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            color: black;
            border-radius: 10px;
            font-size: 50px;
        }

        .bets {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #444;
            color: white;
        }

        button:hover {
            background: #666;
        }

        #spin {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            font-size: 20px;
            background: #168cff;
        }

        #spin:hover {
            background: #006dcc;
        }

        #message {
            min-height: 25px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .bet-info {
            margin-top: 10px;
            color: #bbb;
        }

        .test-info {
            margin-top: 15px;
            color: #ff5555;
            font-size: 13px;
            display: none;
        }

        body.test-mode .test-info {
            display: block;
        }

        .keyboard-info {
            margin-top: 18px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎰 SLOT MACHINE</h1>

        <div class="credits">
            Créditos: <span id="credits">200</span>
        </div>

        <div class="reels">
            <div class="reel" id="reel1">❔</div>
            <div class="reel" id="reel2">❔</div>
            <div class="reel" id="reel3">❔</div>
        </div>

        <div class="bets">
            <button onclick="setBet(10)">10</button>
            <button onclick="setBet(20)">20</button>
            <button onclick="setBet(50)">50</button>
            <button onclick="setBet(100)">100</button>
            <button onclick="allIn()">ALL-IN</button>
        </div>

        <div class="bet-info">
            Aposta: <span id="bet">10</span>
        </div>

        <button id="spin" onclick="spin()">
            GIRAR
        </button>

        <div id="message"></div>

        <div class="test-info"></div>

        <div class="keyboard-info">
            Teclas: 1 = 10 | 2 = 20 | 3 = 50 | 4 = 100 | 5 = ALL-IN | ENTER = GIRAR
        </div>

    </div>

    <script>

        // =========================
        // CONFIGURAÇÕES
        // =========================

        let credits = 200;
        let bet = 10;
        let testMode = false;

        let spacePresses = 0;
        let spaceTimer = null;

        const symbols = [
            "🍒",
            "🍋",
            "🍊",
            "🍇",
            "⭐",
            "7️⃣",
            "🎇"
        ];

        // =========================
        // ELEMENTOS
        // =========================

        const creditsElement = document.getElementById("credits");
        const betElement = document.getElementById("bet");
        const messageElement = document.getElementById("message");

        const reel1 = document.getElementById("reel1");
        const reel2 = document.getElementById("reel2");
        const reel3 = document.getElementById("reel3");

        // =========================
        // ATUALIZAR CRÉDITOS
        // =========================

        function updateCredits() {
            creditsElement.textContent = credits;
        }

        // =========================
        // ESCOLHER APOSTA
        // =========================

        function setBet(value) {

            if (value > credits) {
                messageElement.textContent =
                    "Você não tem créditos suficientes.";
                return;
            }

            bet = value;
            betElement.textContent = bet;
            messageElement.textContent = "";
        }

        // =========================
        // ALL-IN
        // =========================

        function allIn() {

            if (credits <= 0) {
                messageElement.textContent =
                    "Você não tem créditos.";
                return;
            }

            bet = credits;
            betElement.textContent = bet;
            messageElement.textContent = "ALL-IN selecionado!";
        }

        // =========================
        // SÍMBOLO ALEATÓRIO
        // =========================

        function randomSymbol() {
            const index = Math.floor(Math.random() * symbols.length);
            return symbols[index];
        }

        // =========================
        // GIRAR
        // =========================

        function spin() {

            if (credits < bet) {
                messageElement.textContent =
                    "Créditos insuficientes!";
                return;
            }

            if (bet <= 0) {
                messageElement.textContent =
                    "Escolha uma aposta.";
                return;
            }

            credits -= bet;
            updateCredits();

            messageElement.textContent = "Girando...";

            let result1;
            let result2;
            let result3;

            // =========================
            // MODO TESTE
            // Nunca permite 3 iguais
            // =========================

            if (testMode) {

                result1 = randomSymbol();
                result2 = randomSymbol();
                result3 = randomSymbol();

                if (
                    result1 === result2 &&
                    result2 === result3
                ) {

                    let newSymbol;

                    do {
                        newSymbol = randomSymbol();
                    } while (newSymbol === result1);

                    result3 = newSymbol;
                }

            } else {

                // MODO NORMAL
                result1 = randomSymbol();
                result2 = randomSymbol();
                result3 = randomSymbol();
            }

            // =========================
            // MOSTRAR RESULTADOS
            // =========================

            setTimeout(() => {
                reel1.textContent = result1;
            }, 300);

            setTimeout(() => {
                reel2.textContent = result2;
            }, 600);

            setTimeout(() => {

                reel3.textContent = result3;

                // =========================
                // VERIFICAR RESULTADO
                // =========================

                if (
                    result1 === result2 &&
                    result2 === result3
                ) {

                    const prize = bet * 10;

                    credits += prize;
                    updateCredits();

                    messageElement.textContent =
                        "GANHOU! +" + prize + " créditos!";

                } else {

                    messageElement.textContent =
                        "Não foi dessa vez.";
                }

            }, 900);
        }

        // =========================
        // TECLAS DO TECLADO
        // =========================
        //
        // 1 = aposta 10
        // 2 = aposta 20
        // 3 = aposta 50
        // 4 = aposta 100
        // 5 = ALL-IN
        // ENTER = GIRAR
        //
        // O ESP32, através do programa Python,
        // envia essas mesmas teclas para o Windows.
        // =========================

        document.addEventListener("keydown", function(event) {

            // Evita que o navegador faça ações padrão
            // para as teclas usadas pelo projeto.

            if (event.key === "1") {
                event.preventDefault();
                setBet(10);
                return;
            }

            if (event.key === "2") {
                event.preventDefault();
                setBet(20);
                return;
            }

            if (event.key === "3") {
                event.preventDefault();
                setBet(50);
                return;
            }

            if (event.key === "4") {
                event.preventDefault();
                setBet(100);
                return;
            }

            if (event.key === "5") {
                event.preventDefault();
                allIn();
                return;
            }

            if (event.key === "Enter") {
                event.preventDefault();
                spin();
                return;
            }

            // =========================
            // 5 ESPAÇOS = MODO TESTE
            // =========================

            if (event.code !== "Space") {
                return;
            }

            event.preventDefault();

            spacePresses++;

            clearTimeout(spaceTimer);

            spaceTimer = setTimeout(() => {
                spacePresses = 0;
            }, 1500);

            if (spacePresses >= 5) {

                spacePresses = 0;
                testMode = !testMode;

                if (testMode) {

                    document.body.classList.add("test-mode");

                    // Não mostra mensagem na tela.
                    messageElement.textContent = "";

                } else {

                    document.body.classList.remove("test-mode");

                    // Não mostra mensagem na tela.
                    messageElement.textContent = "";
                }
            }
        });

        // =========================
        // INICIALIZAÇÃO
        // =========================

        updateCredits();
        betElement.textContent = bet;

    </script>

</body>
</html>
